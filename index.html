<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Care+</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{
      background:#f5f5f5;
    }

    .topo{
      background:#0d6efd;
      color:white;
      padding:40px;
      text-align:center;
    }

    .caixa{
      background:white;
      padding:25px;
      border-radius:10px;
    }
  </style>
</head>
<body>

  <div class="topo">
    <h1>Hospital Care+</h1>
    <p>Sistema de Triagem</p>
  </div>

  <div class="container mt-4">

    <div class="caixa shadow">

      <h3 class="mb-4">Formulário de Triagem</h3>

      <form>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label>Nome</label>
            <input type="text" class="form-control">
          </div>

          <div class="col-md-3 mb-3">
            <label>Nascimento</label>
            <input type="date" class="form-control">
          </div>

          <div class="col-md-3 mb-3">
            <label>CPF</label>
            <input type="text" class="form-control">
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label>Telefone</label>
            <input type="text" class="form-control">
          </div>

          <div class="col-md-6 mb-3">
            <label>Sexo</label>

            <select class="form-select">
              <option>Masculino</option>
              <option>Feminino</option>
            </select>
          </div>
        </div>

        <h5>Dados de Saúde</h5>

        <div class="row">
          <div class="col-md-3 mb-3">
            <input type="text" class="form-control" placeholder="Temperatura">
          </div>

          <div class="col-md-3 mb-3">
            <input type="text" class="form-control" placeholder="Freq. Cardíaca">
          </div>

          <div class="col-md-3 mb-3">
            <input type="text" class="form-control" placeholder="Pressão">
          </div>

          <div class="col-md-3 mb-3">
            <input type="text" class="form-control" placeholder="Saturação">
          </div>
        </div>

        <div class="mb-3">
          <label>Sintomas</label>
          <textarea class="form-control"></textarea>
        </div>

        <div class="mb-3">
          <label>Risco:</label><br>

          <input type="radio" name="r"> 🔵 Azul
          <input type="radio" name="r"> 🟢 Verde
          <input type="radio" name="r"> 🟡 Amarelo
          <input type="radio" name="r"> 🔴 Vermelho
        </div>

        <button class="btn btn-primary">
          Enviar
        </button>

      </form>

    </div>

  </div>

</body>
</html>
